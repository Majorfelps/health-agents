services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health_agents
    volumes:
      - db_data:/var/lib/postgresql/data
    # Schema é criado pelo Alembic (api/alembic/), rodado no entrypoint do
    # container `api` — não monta mais db/schema.sql aqui pra não haver duas
    # fontes de verdade tentando criar as mesmas tabelas.
    # Não expõe 5432 ao host (postgres do n8n já usa a porta).
    # API acessa via DNS interno `db:5432`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_agents"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://health:health@db:5432/health_agents
      CORS_ORIGINS: '["http://localhost:3000","http://web:3000"]'
      DEBUG: "false"
      # LLM opcional (OpenRouter) — lido do .env na raiz do repo. Sem essas
      # variáveis definidas lá, o chat continua 100% determinístico.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # WhatsApp opcional (Evolution API) — idem, lido do .env na raiz.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_TARGET_NUMBER: ${WHATSAPP_TARGET_NUMBER:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://host.docker.internal:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    # A Evolution API roda num container Docker separado (fora deste
    # compose, ex: stack do n8n), publicada na porta 8080 do host — não
    # dá pra acessar via nome de serviço (rede Docker diferente). Em vez
    # de acoplar este projeto à rede de outro stack, resolve o host via
    # gateway (funciona em Docker Engine ≥20.10 no Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # Portainer já ocupa 8000 no host → expor a API em 8088
    ports:
      - "8088:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* é congelado no bundle em build-time (roda no browser
        # do usuário, não dentro da rede Docker) — por isso aponta pra porta
        # exposta no host (8088), não para o hostname interno `api`.
        NEXT_PUBLIC_API_URL: http://localhost:8088
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  db_data:
